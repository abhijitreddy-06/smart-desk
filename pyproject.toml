[project]
name = "smart-desk"
version = "0.1.0"
description = "Smart Desk workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "huggingface-hub>=0.23.0",
    "python-dotenv>=1.0.1",
    "langchain-google-genai>=2.0.0",
    "unstructured[pdf] (>=0.22.29,<0.23.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "unstructured-inference (>=1.6.11,<2.0.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "rank-bm25>=0.2.2",
    "streamlit>=1.45.0",
]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"